name: Deploy App

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'entries/**'
      - 'scripts/**'
      - 'app-functions/**'
      - 'package.json'
      - 'vite.config.ts'
      - '_headers'
      - '_redirects'
      - '.github/workflows/deploy-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - name: Inject SEO JSON-LD
        run: bun scripts/inject-seo.mjs

      - name: Generate agent-readiness files
        run: bun scripts/build-agent-files.mjs

      - name: Copy headers and redirects
        run: cp _headers _redirects dist/

      # wrangler `pages deploy` resolves Pages Functions at ./functions (the
      # repo root), NOT <output>/functions. The web app keeps its single
      # Function in ./app-functions, so stage it into ./functions before upload.
      - name: Stage Pages Functions
        run: |
          rm -rf functions
          mkdir -p functions
          cp -r app-functions/* functions/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8daf806d18c057c542bd141fce6ca034
          command: pages deploy dist --project-name=undistracted-me-app --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      # Runs after deploy so the key file at public/<key>.txt is already live;
      # IndexNow rejects submissions (HTTP 403) sent before the key is reachable.
      - name: Notify IndexNow
        run: bun scripts/submit-indexnow.mjs
