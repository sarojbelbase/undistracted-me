name: Deploy App to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'functions/**'
      - 'public/**'
      - 'entries/**'
      - 'package.json'
      - '_headers'
      - '_redirects'
      - 'wrangler.toml'
      - '.github/workflows/deploy-app.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Copy headers and redirects into dist
        run: |
          cp _headers dist/_headers
          cp _redirects dist/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8daf806d18c057c542bd141fce6ca034
          command: pages deploy dist --project-name=undistracted-me-app
