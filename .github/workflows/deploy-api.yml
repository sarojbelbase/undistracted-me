name: Deploy API to Cloudflare Pages

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'feature/*'
    paths:
      - 'functions/**'
      - 'pages-api/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Cloudflare Pages Functions must live in <output>/functions. The repo
      # keeps them in /functions, so stage a copy into pages-api before upload.
      - name: Stage Functions into pages-api
        run: |
          rm -rf pages-api/functions
          cp -r functions pages-api/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8daf806d18c057c542bd141fce6ca034
          # `--commit-message` is intentionally omitted: a multi-line commit
          # message body breaks wrangler's argument parsing. `--commit-hash`
          # already identifies the deployment.
          command: pages deploy pages-api --project-name=undistracted-me-api --branch=feature/vite-migration-redesign --commit-hash=${{ github.sha }}
