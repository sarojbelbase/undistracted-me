name: Deploy API

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'pages-api/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # wrangler `pages deploy` resolves Pages Functions at ./functions (the
      # repo root), NOT <output>/functions. The repo keeps them in /api, so
      # stage a copy into ./functions before upload.
      - name: Stage Functions at repo root
        run: |
          rm -rf functions
          cp -r api functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8daf806d18c057c542bd141fce6ca034
          # `--commit-message` is intentionally omitted: a multi-line commit
          # message body breaks wrangler's argument parsing. `--commit-hash`
          # already identifies the deployment. `--commit-dirty=true` silences
          # the "uncommitted changes" warning for the CI-staged ./functions.
          command: pages deploy pages-api --project-name=undistracted-me-api --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
