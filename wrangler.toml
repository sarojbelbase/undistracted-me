# Cloudflare Pages configuration for the "Undistracted Me" web app + functions.
name = "undistracted-me-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# KV binding for the "web app tries" counter (functions/tries.js + functions/_kv.js).
# The dashboard Bindings section is read-only while this file is the source of
# truth, so the binding must live here. The API project (undistracted-me-api)
# also deploys with this file in the working directory, so the binding applies
# there too.
[[kv_namespaces]]
binding = "TRIES"
id = "733bec0e4b41431c9c0939f4a0328567"
