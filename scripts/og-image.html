<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink: #0b0b0b;
      --cream: #f4f1ec;
      --mute: #4a4942;
      --soft: #26241f;
      --sun: #f6b414;
      --orb: 246, 180, 20; /* sun gold, the brand accent */
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background layers (z-index 0): sit strictly behind the text ────── */
    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
    }
    .orb--1 {
      width: 720px;
      height: 720px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 50%, rgba(var(--orb), 0.16) 0%, rgba(var(--orb), 0.06) 50%, transparent 72%);
      filter: blur(52px);
    }
    .orb--2 {
      width: 540px;
      height: 540px;
      top: -160px;
      right: -100px;
      background: radial-gradient(circle at 50% 50%, rgba(var(--orb), 0.11) 0%, transparent 65%);
      filter: blur(64px);
    }
    .orb--3 {
      width: 480px;
      height: 480px;
      bottom: -160px;
      left: -110px;
      background: radial-gradient(circle at 50% 50%, rgba(var(--orb), 0.08) 0%, transparent 62%);
      filter: blur(80px);
    }
    .shimmer {
      position: absolute;
      inset: -10%;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(var(--orb), 0.04) 90deg, transparent 180deg, rgba(var(--orb), 0.03) 270deg, transparent 360deg);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 88% 82% at 50% 50%, transparent 34%, rgba(244, 241, 236, 0.55) 68%, rgba(238, 234, 226, 0.92) 100%);
    }
    /* Clean cream reading bed behind the text */
    .readback {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 58% 66% at 50% 50%, rgba(255, 253, 248, 0.85) 0%, rgba(255, 253, 248, 0.45) 55%, rgba(244, 241, 236, 0) 78%);
    }

    /* ── Text content (z-index 1): always above the background ──────────── */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .lotus {
      width: 176px;
      height: 176px;
      filter: brightness(0);
      opacity: 0.92;
      margin-bottom: 26px;
    }
    h1 {
      margin: 0;
      font-size: 96px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--ink);
    }
    .tagline {
      margin: 22px 0 0;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 600;
      color: var(--soft);
      max-width: 800px;
    }
    .divider {
      width: 64px;
      height: 4px;
      border-radius: 2px;
      background: var(--sun);
      margin: 26px 0 22px;
    }
    .sub {
      margin: 0;
      font-family: "SFMono-Regular", ui-monospace, "DM Mono", Menlo, monospace;
      font-size: 16px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
      white-space: nowrap;
    }
    .foot {
      position: absolute;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 15px;
      letter-spacing: 0.05em;
      color: #55534c;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="shimmer"></div>
    <div class="vignette"></div>
    <div class="readback"></div>
  </div>
  <div class="content">
    <img class="lotus" src="../public/favicon/lotus512.png" alt="" />
    <h1>Undistracted Me</h1>
    <p class="tagline">A calm, distraction-free new tab with 30+ quiet widgets. Free, open source, works offline.</p>
    <div class="divider"></div>
    <p class="sub">Site blocker &middot; Pomodoro &middot; Pocket &middot; Note Mode &middot; Focus Mode &middot; Nepali calendar</p>
  </div>
  <p class="foot">app.undistracted.me</p>
</body>
</html>
